services:
  postgres:
    image: postgres:16-alpine
    container_name: world-ai-curation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_ai_curation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_ai_curation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
